name: Sync HTTPDNS Combined

# 每日把 script/httpdns-combined/sync.py 的合并结果（可莉 × blackmatrix7）同步到仓库。
# 北京时间 05:20（UTC 21:20）。手动触发：Actions 页 Run workflow。
on:
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate merged module
        working-directory: script/httpdns-combined
        run: python3 sync.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/httpdns-combined/BlockHTTPDNS-Combined.sgmodule
          git diff --cached --quiet || git commit -m "chore: sync BlockHTTPDNS combined module"
          git push
