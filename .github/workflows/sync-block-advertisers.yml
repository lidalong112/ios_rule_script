name: Sync BlockAdvertisers

# 每日同步可莉「广告平台拦截器」的转换版（Repcz/Tool）并应用本地修正。
# 北京时间 05:35（UTC 21:35）。手动触发：Actions 页 Run workflow。
on:
  schedule:
    - cron: "35 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate module
        working-directory: script/block-advertisers
        run: python3 sync.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/block-advertisers/BlockAdvertisers.sgmodule
          git diff --cached --quiet || git commit -m "chore: sync BlockAdvertisers module"
          git push
